global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["host.docker.internal:9093"]

scrape_configs:
  - job_name: qianke
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
    # 如果配置了 QIANKE_METRICS_TOKEN：
    # headers:
    #   X-Metrics-Token:
    #     values: ["<token>"]
