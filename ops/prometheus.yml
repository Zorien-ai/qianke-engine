global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["host.docker.internal:19093"]

scrape_configs:
  - job_name: qianke
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token.txt
    static_configs:
      - targets: ["host.docker.internal:8000"]

