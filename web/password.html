<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>千客 · 修改密码</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f6f5f2; color: #1f2328;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    main { width: min(420px, calc(100vw - 32px)); background: #fff; border: 1px solid #e4e1da; border-radius: 16px; padding: 28px; }
    h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
    p.hint { margin: 0 0 22px; color: #6b7280; font-size: 13px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #374151; }
    input {
      width: 100%; padding: 11px 12px; border: 1px solid #d8d4cb; border-radius: 10px;
      font-size: 15px; outline: none; background: #fff;
    }
    input:focus { border-color: #1f2328; }
    button {
      width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 10px;
      background: #1f2328; color: #fff; font-size: 15px; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    #msg { margin-top: 16px; min-height: 22px; font-size: 13px; }
    .ok { color: #166534; }
    .err { color: #b91c1c; }
    a { color: #1f2328; }
  </style>
</head>
<body>
  <main>
    <h1>修改密码</h1>
    <p class="hint">需要先登录。修改成功后全部会话失效，请用新密码重新登录。</p>
    <label for="current">当前密码</label>
    <input id="current" type="password" autocomplete="current-password" />
    <label for="next">新密码（至少 10 位）</label>
    <input id="next" type="password" autocomplete="new-password" />
    <label for="confirm">确认新密码</label>
    <input id="confirm" type="password" autocomplete="new-password" />
    <button id="submit" type="button">修改密码</button>
    <div id="msg" role="status" aria-live="polite"></div>
    <p class="hint" style="margin-top:18px"><a href="/v2/">返回工作台</a></p>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    $('submit').addEventListener('click', async () => {
      const current = $('current').value;
      const next = $('next').value;
      const confirm = $('confirm').value;
      const msg = $('msg');
      msg.className = '';
      msg.textContent = '';
      if (!current || !next) { msg.className = 'err'; msg.textContent = '请填写当前密码和新密码'; return; }
      if (next.length < 10) { msg.className = 'err'; msg.textContent = '新密码至少 10 位'; return; }
      if (next !== confirm) { msg.className = 'err'; msg.textContent = '两次输入的新密码不一致'; return; }
      const button = $('submit');
      button.disabled = true;
      try {
        const response = await fetch('/auth/change-password', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current_password: current, new_password: next }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          msg.className = 'err';
          msg.textContent = data.detail || '修改失败，请重新登录后再试';
          return;
        }
        msg.className = 'ok';
        msg.textContent = data.message || '密码已修改，请重新登录';
        $('current').value = ''; $('next').value = ''; $('confirm').value = '';
      } catch (error) {
        msg.className = 'err';
        msg.textContent = '网络异常，请稍后重试';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
