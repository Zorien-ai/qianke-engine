[project]
name = "rag-demo"
version = "0.1.0"
description = "用户画像 RAG Demo"
readme = "README.md"
authors = [
    { name = "zzq", email = "q93304989@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "fastapi>=0.142.4",
    "flagembedding>=1.4.2",
    "huggingface-hub>=1.33.0",
    "jieba>=0.42.1",
    "langchain>=1.4.3",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "modelscope>=1.40.1",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pynvml>=13.0.1",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=3.0.0",
    "torch==2.14.1",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { path = "wheels/torch-2.14.1+cu126-cp312-cp312-win_amd64.whl" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
