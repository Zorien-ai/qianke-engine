[project]
name = "qianke-engine"
version = "0.1.0"
description = "千客引擎（Qianke Engine）—— 专为电商打造的轻量级 AI 用户画像与业务分析引擎"
readme = "README.md"
authors = [
    { name = "zzq", email = "q93304989@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "alembic>=1.20.1",
    "alibabacloud-oss-v2>=1.4.0",
    "argon2-cffi>=25.1.0",
    "datasets>=5.1.0",
    "fastapi>=0.142.4",
    "flagembedding>=1.4.2",
    "huggingface-hub>=1.33.0",
    "jieba>=0.42.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.7",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "matplotlib>=3.11.2",
    "modelscope>=1.40.1",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pynvml>=13.0.1",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=3.0.0",
    # ⚠ 必须锁定本地 cu126 wheel（见下方 [tool.uv.sources]），不能写成 ">=2.4,<3"：
    # PyPI 在 Windows 上提供的是 CPU 版 torch，任何一次 uv lock/sync/run 都会把
    # .venv 里的 cu126 换成 +cpu，服务静默退化为 device=cpu。
    # 背景与排查记录：bug/10.10/2026-10-10_环境与评测问题.md §2
    "torch==2.14.1+cu126",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# 项目/仓库名改为 qianke-engine，但 Python 包名仍保持 rag_demo（避免 import 大迁移）。
[tool.uv.build-backend]
module-name = "rag_demo"

# 本地 wheel 源（wheels/ 已在 .gitignore 里，不入库）。
# 作用：让解析器永远不去 PyPI 取 torch——它是「保持 CUDA」的唯一保证，
# 删掉这段不会报错，但下一次 uv run 会悄悄把 torch 换成 CPU 版。
# ⚠ 换机器/清空 wheels/ 后需把同版本 wheel 放回该路径，否则 uv lock/sync 会
#   直接报「路径不存在」——这是特意的：宁可明确失败，也不要静默退回 CPU。
[tool.uv.sources]
torch = { path = "wheels/torch-2.14.1+cu126-cp312-cp312-win_amd64.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 只收 tests/ 下的单测：src/rag_demo/tests 里是历史评测脚本（要模型/数据/网络），
# 不是 pytest 用例，被自动收进来会一跑就红。
testpaths = ["tests"]
# 真实 LLM / 数据库集成测试默认单独标记，CI 无凭证时自动 skip。
markers = [
    "integration: 需要真实 DEEPSEEK_API_KEY 与本地数据库的端到端测试",
]
# 让源码目录可直接导入，无需先安装为包；也避免不同机器的 cwd 影响导入。
pythonpath = ["src"]
