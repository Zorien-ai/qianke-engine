[project]
name = "rag-demo"
version = "0.1.0"
description = "用户画像 RAG Demo"
readme = "README.md"
authors = [
    { name = "zzq", email = "q93304989@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "argon2-cffi>=25.1.0",
    "datasets>=5.1.0",
    "fastapi>=0.142.4",
    "flagembedding>=1.4.2",
    "huggingface-hub>=1.33.0",
    "jieba>=0.42.1",
    "langchain>=1.4.3",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "modelscope>=1.40.1",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "pynvml>=13.0.1",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=3.0.0",
    # 跨平台可复现：从 PyPI 解析；CUDA 用户可按 README 用官方 PyTorch 索引覆盖安装
    "torch>=2.4,<3",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 只收 tests/ 下的单测：src/rag_demo/tests 里是历史评测脚本（要模型/数据/网络），
# 不是 pytest 用例，被自动收进来会一跑就红。
testpaths = ["tests"]
# 让源码目录可直接导入，无需先安装为包；也避免不同机器的 cwd 影响导入。
pythonpath = ["src"]
