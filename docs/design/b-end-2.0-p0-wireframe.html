<body>
<a class="skip" href="#main">跳到主要内容</a>
<button id="veil" class="mobile-veil" aria-label="关闭导航"></button>
<aside class="sidebar" id="sidebar" aria-label="主导航"><div class="brand"><span class="brand-mark">千</span><div>千客<small>MERCHANT WORKSPACE</small></div></div><nav id="nav"></nav><div class="side-bottom"><strong>P0 · 设计评审稿</strong><br>离线运行 · 数据全部为示例<br>2026.11 / v0.1</div></aside>
<div class="app"><header class="topbar"><div class="row"><button id="menu" class="btn mobile-menu" aria-label="打开导航" aria-expanded="false">☰</button><div class="shop"><div class="shop-icon" aria-hidden="true">茶</div><div><strong>清和茶事 <span class="small muted">· 示例店</span></strong><div class="small muted">单店模式 · 多店切换暂不可用</div></div></div><button class="btn ghost shop-change" disabled title="商家成员关系与切店能力尚未接入">切换店铺</button></div><div class="row"><span class="pill amber"><span class="dot"></span>模拟交易</span><span class="avatar top-user" id="avatar">店主</span></div></header>
<div class="demo-banner"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg><span><strong>离线设计原型</strong> · 所有金额、订单与顾客均为虚构样例，不产生收款、发货或库存变更。</span></div>
<div class="lab" aria-label="设计稿演练控件"><span class="eyebrow">PREVIEW</span><label>角色预览<select id="role" aria-label="角色预览"><option value="owner">店主</option><option value="service">客服</option><option value="warehouse">仓库</option></select></label><label>页面状态<select id="state" aria-label="页面状态"><option value="normal">正常</option><option value="loading">加载中</option><option value="empty">空数据</option><option value="error">加载失败</option><option value="denied">权限不足</option></select></label><button class="btn ghost" id="reset">重置演练</button><span class="note">角色切换仅预览布局；不代表真实权限切换</span></div>
<main class="main" id="main" tabindex="-1"></main></div>
<nav class="bottom-nav" id="bottomNav" aria-label="手机快捷导航"></nav>
<dialog class="drawer" id="drawer" aria-labelledby="drawerTitle"></dialog><dialog id="modal" aria-labelledby="modalTitle"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const icons={home:'M3 10l9-7 9 7v10H3z M9 20v-7h6v7',orders:'M6 3h12v18H6z M9 8h6M9 12h6M9 16h4',products:'M3 7l9-4 9 4v11l-9 4-9-4z M3 7l9 5 9-5M12 12v10',chat:'M4 4h16v12H9l-5 4z M8 8h8M8 12h5',return:'M8 6H4v4M4 6l5 5M6 6a8 8 0 1 1-1 11',report:'M5 3h14v18H5z M8 16v-3M12 16V8M16 16v-6',shield:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M9 12l2 2 4-4',leaf:'M19 4C8 2 3 7 5 15s13 7 14-11z M5 20L15 9',arrow:'M4 12h16M14 6l6 6-6 6',box:'M3 7l9-4 9 4v13H3z M3 7h18M9 11h6',clock:'M12 8v5l3 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',alert:'M12 3l10 18H2z M12 9v5m0 3h.01',empty:'M3 10l4-6h10l4 6v10H3z M3 10h5l2 4h4l2-4h5'};
const icon=name=>`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${icons[name]||icons.box}"/></svg>`;
const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'¥'+v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const orderSeed=[
{id:'DEMO-110101',customer:'示例顾客 A',product:'明前龙井',sku:'100g · 罐装',price:148,qty:2,status:'PAID',created:'2026-11-13 10:42',completed:null},
{id:'DEMO-110102',customer:'示例顾客 B',product:'白牡丹',sku:'150g · 简装',price:158,qty:1,status:'PAID',created:'2026-11-13 10:26',completed:null},
{id:'DEMO-110103',customer:'示例顾客 C',product:'正山小种',sku:'100g · 袋装',price:99,qty:1,status:'CREATED',created:'2026-11-13 10:08',completed:null},
{id:'DEMO-110104',customer:'示例顾客 D',product:'明前龙井',sku:'100g · 罐装',price:148,qty:2,status:'SHIPPED',created:'2026-11-12 16:15',completed:null},
{id:'DEMO-110105',customer:'示例顾客 E',product:'明前龙井',sku:'100g · 罐装',price:148,qty:1,status:'COMPLETED',created:'2026-11-12 14:36',completed:'2026-11-13 09:52'},
{id:'DEMO-110106',customer:'示例顾客 F',product:'正山小种',sku:'100g · 袋装',price:99,qty:2,status:'COMPLETED',created:'2026-11-11 11:20',completed:'2026-11-13 09:18'},
{id:'DEMO-110107',customer:'示例顾客 G',product:'白牡丹',sku:'150g · 简装',price:158,qty:2,status:'PAID',created:'2026-11-13 09:05',completed:null},
{id:'DEMO-110108',customer:'示例顾客 H',product:'白牡丹',sku:'100g · 罐装',price:138,qty:1,status:'COMPLETED',created:'2026-11-12 13:11',completed:'2026-11-13 08:46'}];
const products=[{id:'P01',name:'明前龙井',tone:'',skus:[{id:'LJ100',name:'100g · 罐装',price:148,available:8,locked:2,safety:12},{id:'LJ050',name:'50g · 袋装',price:88,available:22,locked:1,safety:10}]},{id:'P02',name:'白牡丹',tone:'gold',skus:[{id:'BM150',name:'150g · 简装',price:158,available:5,locked:3,safety:10},{id:'BM100',name:'100g · 罐装',price:138,available:18,locked:0,safety:8}]},{id:'P03',name:'正山小种',tone:'rose',skus:[{id:'ZX100',name:'100g · 袋装',price:99,available:0,locked:2,safety:6},{id:'ZX200',name:'200g · 礼盒',price:188,available:14,locked:0,safety:6}]}];
const allSkus=()=>products.flatMap(p=>p.skus.map(s=>({...s,product:p.name,tone:p.tone})));
const labels={CREATED:'待模拟支付',PAID:'待发货 · 模拟',SHIPPED:'已发货 · 模拟',COMPLETED:'已完成 · 模拟'};
const roles={owner:'店主',service:'客服',warehouse:'仓库'};
let orders=structuredClone(orderSeed),view='home',role='owner',pageState='normal',statusFilter='',query='',page=1,selection=new Set(),skuSelection=new Set(),onlyLow=false,toastTimer,dialogOrder=null,logs=[];
const navs=[['工作台',[['home','工作首页','home']]],['交易与商品',[['orders','订单管理','orders'],['products','商品与 SKU','products']]],['客户服务',[['service','客服会话','chat'],['aftersales','售后处理','return']]],['经营与管理',[['reports','经营报告','report'],['audit','权限与审计','shield']]]];
const btn=(text,action,extra='',type='')=>`<button class="btn ${type}" data-action="${action}" ${extra}>${text}</button>`;
const badge=status=>`<span class="pill ${status==='PAID'?'amber':status==='COMPLETED'?'teal':''}">${labels[status]}</span>`;
const total=o=>o.price*o.qty;
const art=tone=>`<span class="product-art ${tone||''}">${icon('leaf')}</span>`;
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4200)}
function closeNav(){$('sidebar').classList.remove('open');$('veil').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}
function navigate(next){view=next;pageState='normal';$('state').value='normal';selection.clear();skuSelection.clear();page=1;query='';statusFilter='';onlyLow=false;closeNav();render();$('main').focus();window.scrollTo(0,0)}
function filtered(){return orders.filter(o=>(!statusFilter||o.status===statusFilter)&&(!query||`${o.id} ${o.customer} ${o.product}`.toLowerCase().includes(query.toLowerCase())))}
function renderNav(){
 $('nav').innerHTML=navs.map(([group,items])=>`<div class="nav-group">${group}</div>${items.map(([key,label,glyph])=>`<button class="nav-item ${view===key?'active':''}" data-view="${key}" ${view===key?'aria-current="page"':''}>${icon(glyph)}<span>${label}</span>${['aftersales','reports','audit'].includes(key)?'<span class="tiny">规划</span>':''}</button>`).join('')}`).join('');
 $('bottomNav').innerHTML=[['home','首页'],['orders','订单'],['products','商品'],['service','客服']].map(([key,label])=>`<button class="${view===key?'active':''}" data-view="${key}" ${view===key?'aria-current="page"':''}>${icon(key==='service'?'chat':key)}${label}</button>`).join('');$('avatar').textContent=roles[role];
}
function heading(){const titles={home:{owner:['今日经营，一眼有数','先看模拟完成流水，再处理待发货与库存提醒。'],service:['从一段顾客对话开始','客服视角 · 会话优先，订单和售后作为上下文。'],warehouse:['先把商品与库存理清','仓库视角 · 更新 SKU 数据，核对待发货订单。']}[role],orders:['订单管理','以订单为单位查看状态与明细，金额全部属于模拟交易。'],products:['商品与 SKU','商品看全貌，SKU 看可用、锁定与安全库存。'],service:['客服会话','坐席收件箱的布局预览；会话接入方案仍待确认。'],aftersales:['售后处理','沿用既有售后能力；本稿保留分组位置，详细方案后续展开。'],reports:['经营报告','以订单完成时间归属模拟流水；当前不推导实际收入与利润。'],audit:['权限与审计','真实授权以服务端为准；本稿的角色选择仅用于布局评审。']};return `<div class="page-head"><div><div class="eyebrow">${view==='home'?'WORKSPACE / '+roles[role]:'WORKSPACE / '+(view==='orders'?'ORDERS':view==='products'?'PRODUCTS':'SERVICE')}</div><h1>${titles[view][0]}</h1><p>${titles[view][1]}</p></div><div class="page-date">2026 年 11 月 13 日<br><span class="small">固定演练日期 · 北京时间</span></div></div>`}
function kpi(label,value,unit,foot,accent=false){return `<article class="kpi ${accent?'accent':''}"><div class="label">${label}</div><span class="mini-icon">${icon('report')}</span><strong class="mono">${value}<small>${unit}</small></strong><p>${foot}</p></article>`}
function task(title,desc,count,action,glyph='box'){return `<div class="task-row"><span class="task-symbol">${icon(glyph)}</span><div class="grow"><strong>${title}</strong><p>${desc}</p></div><span class="number mono">${count}</span>${btn('查看 →',action,'','text')}</div>`}
function home(){const done=orders.filter(o=>o.status==='COMPLETED'&&o.completed?.startsWith('2026-11-13')),paid=orders.filter(o=>o.status==='PAID'),low=allSkus().filter(s=>s.available<=s.safety);
 if(role==='service')return `<div class="callout amber"><strong>客服会话尚未接入。</strong> 下方为虚构会话布局，不显示真实未读量，也不会发送消息。</div>${servicePanel()}<div class="section-title"><h2>处理对话时，随手查到</h2></div><section class="panel">${task('订单与物流','按订单号查询，查看模拟状态','', 'orders','orders')}${task('售后处理','查询原订单和已有售后流程','', 'aftersales','return')}</section>`;
 if(role==='warehouse')return `<div class="kpis">${kpi('需要核对的低库存 SKU',low.length,'项','来自 6 个虚构 SKU；可用量 ≤ 安全量',true)}${kpi('待发货样例',paid.length,'笔','模拟订单，不产生真实履约')}${kpi('商品数据',products.length,'款','共 6 个规格；本页样例全集')}</div><div class="home-grid"><section class="panel"><div class="panel-head"><div><h2>今天先核对这些</h2><p>库存不足与锁定数量分别呈现</p></div>${btn('查看全部','products','','text')}</div>${low.map(s=>task(s.product+' · '+s.name,`可用 ${s.available} / 锁定 ${s.locked} / 安全 ${s.safety}`,'','lowstock','products')).join('')}<div class="rule-note">补货提示基于安全库存差额，未预测销售或采购周期。</div></section><section class="panel"><div class="panel-head"><div><h2>商品更新工作区</h2><p>先核对选择范围，再预览改动</p></div></div><div class="pad stack"><p>按 SKU 选择库存记录，保留锁定量，逐项查看调整前后差异。</p>${btn('进入商品与 SKU','products','','primary')}<div class="callout">批量保存尚未接入。设计稿可演练选择与预览，不改真实库存。</div></div></section></div>`;
 return `<div class="kpis">${kpi('今日模拟完成流水',money(done.reduce((sum,o)=>sum+total(o),0)),'','按完成时间归属；非实际收款或净收入',true)}${kpi('今日模拟完成订单',done.length,'笔','来源：本稿 8 笔订单样例全集')}${kpi('待发货样例',paid.length,'笔','仅计待发货状态；与完成流水分开')}</div><div class="home-grid"><section class="panel"><div class="panel-head"><div><h2>优先处理</h2><p>把注意力放在明确的工作上</p></div><span class="pill">样例待办</span></div>${task('待发货订单','先核对商品、数量与履约信息',paid.length,'pending','orders')}${task('低库存 SKU','查看可用量与安全库存差额',low.length,'lowstock','products')}${task('待模拟支付','演示动作需确认；不代表收款',orders.filter(o=>o.status==='CREATED').length,'unpaid','clock')}<div class="rule-note">全部数量来自当前样例；正式版须由服务端汇总，不能用加载条数替代总量。</div></section><section class="panel"><div class="panel-head"><div><h2>经营报告</h2><p>先把统计口径说清楚</p></div><span class="pill">待接入</span></div><div class="trend-empty"><div class="symbol">↗</div><h3>暂不绘制经营趋势</h3><p>当前只有设计样例。完整的时间序列、退款冲减和跨期归属确定后，再提供可复核报告。</p></div><div class="rule-note">完成时间口径已确认；退款处理和跨月归属仍待产品确认。</div></section></div><div class="section-title"><h2>今日模拟完成明细</h2>${btn('全部订单 →','orders','','text')}</div><div class="completed-list">${done.map(o=>`<button class="completed-item" data-order="${o.id}"><span>${o.customer}<small>${o.id} · ${o.completed.slice(11)}</small></span><b class="mono">${money(total(o))}</b></button>`).join('')}</div><p class="section-note">模拟完成流水 = 今日完成的样例订单金额之和。未扣退款、成本或费用，不作为实际经营结论。</p>`;
}

function orderPage(){const rows=filtered(),count=rows.length;page=Math.min(page,Math.max(1,Math.ceil(count/4)));const slice=rows.slice((page-1)*4,page*4);return `<section class="filter-panel"><div class="tabs" aria-label="订单状态筛选">${[['','全部'],['CREATED','待模拟支付'],['PAID','待发货'],['SHIPPED','已发货'],['COMPLETED','已完成']].map(([s,l])=>`<button class="tab ${statusFilter===s?'active':''}" data-filter="${s}" aria-pressed="${statusFilter===s}">${l}<small>${orders.filter(o=>!s||o.status===s).length}</small></button>`).join('')}</div><form id="searchForm" class="filters"><label class="field grow">订单 / 顾客 / 商品<input id="search" value="${escape(query)}" placeholder="输入订单号、顾客或商品名"></label><button class="btn primary" type="submit">查找样例</button><button class="btn" type="button" data-action="clear-filters">清除筛选</button></form></section><section class="panel"><div class="list-toolbar"><div class="row wrap"><label class="check"><input type="checkbox" id="selectPage" aria-label="选择本页订单" ${slice.length&&slice.every(o=>selection.has(o.id))?'checked':''} ${!slice.length?'disabled':''}>本页选择</label><strong>${count} 笔样例</strong></div><span class="muted">样例全集 8 笔 · 非全店订单统计</span></div><div class="select-all">已选 ${selection.size} 笔。${btn(`选择当前筛选全部 ${count} 笔（含其他页）`,'select-filter',!count?'disabled':'','text')} ${selection.size?btn('清空','clear-selection','','text'):''}</div><div class="table-scroll order-table-wrap"><table class="order-table"><thead><tr><th aria-label="选择"></th><th>订单 / 商品</th><th>顾客</th><th>模拟金额</th><th>状态</th><th>详情</th></tr></thead><tbody>${slice.map(o=>`<tr><td><input type="checkbox" data-select="${o.id}" aria-label="选择订单 ${o.id}" ${selection.has(o.id)?'checked':''}></td><td><button class="order-id" data-order="${o.id}">${o.id}</button><small>${o.product} · ${o.sku} × ${o.qty}</small><small>创建 ${o.created}</small></td><td>${o.customer}<small>顾客资料为虚构</small></td><td><strong class="mono">${money(total(o))}</strong><small>模拟交易</small></td><td>${badge(o.status)}</td><td>${btn('查看','detail',`data-id="${o.id}"`,'text')}</td></tr>`).join('')||'<tr><td colspan="6">没有匹配的样例。请调整筛选条件。</td></tr>'}</tbody></table></div><div class="cards-mobile">${slice.map(o=>`<article class="order-card"><div class="row"><input type="checkbox" data-select="${o.id}" aria-label="选择订单 ${o.id}" ${selection.has(o.id)?'checked':''}><div class="grow"><button class="order-id" data-order="${o.id}">${o.id}</button><p class="small muted">${o.customer}</p></div></div><div class="detail"><p>${o.product} · ${o.sku} × ${o.qty}</p>${badge(o.status)}<p class="small muted">创建 ${o.created}</p></div><div class="foot"><strong>${money(total(o))} <span class="small muted">模拟</span></strong>${btn('查看详情','detail',`data-id="${o.id}"`,'text')}</div></article>`).join('')||'<p class="pad">没有匹配的样例。</p>'}</div><div class="pagination"><span>第 ${count?(page-1)*4+1:0}–${Math.min(page*4,count)} 笔 / ${count} 笔</span><div class="row">${btn('上一页','prev',page===1?'disabled':'')}<span>${page} / ${Math.max(1,Math.ceil(count/4))}</span>${btn('下一页','next',page*4>=count?'disabled':'')}</div></div></section>${selection.size?`<div class="batchbar"><div><strong>已选择 ${selection.size} 笔订单</strong><p class="small">跨页保留 · 改变筛选或角色将清空</p></div><div class="actions">${btn('预览批量发货','batch-ship',role==='service'?'disabled title="客服视角无发货权限"':'','primary')}${btn('下载选中样例','export-orders',role==='service'?'disabled title="导出授权待确认"':'')}</div></div>`:''}`}
function productPage(){const list=products.filter(p=>!onlyLow||p.skus.some(s=>s.available<=s.safety));return `<div class="callout">批量库存契约尚未接入。可选择多个 SKU、预览盘点差异；保存保持禁用，锁定数量不可编辑。</div><div class="filter-panel"><div class="row between wrap"><div class="tabs" style="margin:0;border:0;padding:0"><button class="tab ${!onlyLow?'active':''}" data-action="all-products">全部商品 ${products.length}</button><button class="tab ${onlyLow?'active':''}" data-action="low-products">低库存 SKU ${allSkus().filter(s=>s.available<=s.safety).length}</button></div><span class="small muted">样例全集 3 款 / 6 个 SKU</span></div></div><div class="product-grid">${list.map(p=>`<article class="product-card"><div class="product-header">${art(p.tone)}<div><h3>${p.name}</h3><p>${p.id} · 示例商品</p></div></div><div class="product-stats"><div><b>${p.skus.reduce((n,s)=>n+s.available,0)}</b><small>可用合计</small></div><div><b>${p.skus.reduce((n,s)=>n+s.locked,0)}</b><small>锁定合计</small></div><div><b>${p.skus.length}</b><small>规格数</small></div></div>${p.skus.filter(s=>!onlyLow||s.available<=s.safety).map(s=>`<div class="sku-row"><input type="checkbox" data-sku="${s.id}" aria-label="选择 SKU ${s.id}" ${skuSelection.has(s.id)?'checked':''} ${role==='service'?'disabled title="客服视角仅可查看"':''}><div><strong>${s.name}</strong><small>${s.id} · ${money(s.price)}</small><small>锁定 ${s.locked} · 安全 ${s.safety}</small>${s.available<=s.safety?`<span class="pill ${s.available===0?'red':'amber'}">${s.available===0?'无可用库存':'低库存'} · 差额 ${Math.max(0,s.safety-s.available)}</span>`:''}</div><div><span class="stock mono">${s.available}</span><small>可用</small></div></div>`).join('')}<div class="rule-note">图片占位为示意图标；库存来自固定样例。</div></article>`).join('')}</div>${skuSelection.size?`<div class="batchbar"><div><strong>已选 ${skuSelection.size} 个 SKU</strong><p class="small">库存按规格处理，不混用商品总量</p></div><div class="actions">${btn('预览库存调整','batch-stock','','primary')}${btn('清空选择','clear-skus')}</div></div>`:''}<p class="section-note">低库存：可用量 ≤ 安全量；建议差额：max(0, 安全量 function placeholder(){return `<section class="state-panel"><div class="state-icon">${icon(view==='reports'?'report':view==='audit'?'shield':'return')}</div><h2>${view==='reports'?'经营报告等待口径与数据接入':view==='audit'?'权限与审计沿用现有能力':'售后详细方案后续展开'}</h2><p>${view==='reports'?'订单完成时间是统计依据，退款冲减与跨期归属仍待确认。当前不展示虚构趋势。':view==='audit'?'店主、客服、仓库是业务视角。正式权限仍由服务端返回，隐藏按钮不能替代权限校验。':'此处用于评审导航归属，不执行退款、退货或取消操作。'}</p>${btn('返回工作首页','home')}</section>`}
function statePanel(){const states={loading:['clock','正在加载页面','加载中保留页面标题与导航，不把尚未返回的数据当成 0。'],empty:['empty','当前范围暂无数据','空结果只说明当前店铺与筛选范围没有记录，不推断全店没有业务。'],error:['alert','页面加载失败','没有取得数据，不能显示“暂无订单”或“库存充足”。当前为失败状态演练。'],denied:['shield','当前角色没有访问权限','请联系店主核对权限。真实环境不能通过前端角色切换绕过授权。']};const [glyph,title,text]=states[pageState];return `<section class="state-panel" ${pageState==='loading'?'aria-busy="true"':''}><div class="state-icon">${icon(glyph)}</div><h2>${title}</h2><p>${text}</p>${pageState==='loading'?'<div class="skeletons" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><p class="small">使用上方“页面状态”切回正常，结束加载演练。</p>':btn(pageState==='error'?'重试（演练）':pageState==='empty'?'清除筛选（演练）':'返回首页','recover','','primary')}</section>`}
function render(){renderNav();$('main').innerHTML=heading()+(pageState!=='normal'?statePanel():view==='home'?home():view==='orders'?orderPage():view==='products'?productPage():view==='service'?'<div class="callout amber">会话为虚构样例。分配、未读、发送均尚未接入，不代表实时客服能力。</div>'+servicePanel():placeholder())+`<footer class="footer"><span>千客 B 端 2.0 / P0 设计评审稿</span><span>样例不持久保存 · 刷新可复原 · 无网络连接</span></footer>`;const cb=$('selectPage');if(cb){const slice=filtered().slice((page-1)*4,page*4),n=slice.filter(o=>selection.has(o.id)).length;cb.indeterminate=n>0&&n<slice.length}}
function drawer(o){dialogOrder=o.id;const canSim=role==='owner'&&['CREATED','SHIPPED'].includes(o.status);$('drawer').innerHTML=`<div class="dialog-shell"><div class="dialog-head"><div><span class="eyebrow">ORDER DETAIL / 模拟交易</span><h2 id="drawerTitle" style="margin-top:6px">${o.id}</h2><p class="small muted">清和茶事 · 示例店</p></div><button class="close" data-close="drawer" aria-label="关闭订单详情">×</button></div><div class="dialog-body"><div class="row between wrap">${badge(o.status)}<strong class="mono" style="font-size:26px">${money(total(o))}</strong></div><div class="callout amber" style="margin-top:20px;margin-bottom:0">订单为虚构样例。模拟支付不产生资金，模拟完成不代表真实签收或结算。</div><dl class="info-grid"><div><dt>顾客</dt><dd>${o.customer}</dd></div><div><dt>交易类型</dt><dd>模拟交易 / DEMO</dd></div><div><dt>创建时间</dt><dd>${o.created}</dd></div><div><dt>完成时间</dt><dd>${o.completed||'— 尚未模拟完成'}</dd></div><div><dt>支付来源</dt><dd>${o.status==='CREATED'?'未模拟支付':'演示状态 / DEMO'}</dd></div><div><dt>完成来源</dt><dd>${o.completed?'DEMO · 样例记录':'—'}</dd></div></dl><section class="detail-section"><h3>商品明细</h3><div class="goods-line">${art('')}<div><strong>${o.product}</strong><p>${o.sku} × ${o.qty}</p><p>单价 ${money(o.price)}</p></div><b>${money(total(o))}</b></div></section><section class="detail-section"><h3>履约信息</h3><p class="small muted">虚构顾客，无真实地址或物流单号。批量发货入口仅预览范围，正式提交等待接入。</p></section><section class="detail-section"><h3>状态记录 · 样例</h3><ol class="timeline"><li>创建模拟订单<small>${o.created} · 固定样例</small></li>${o.status!=='CREATED'?'<li>模拟支付状态<small>来源 DEMO · 不代表真实收款</small></li>':''}${['SHIPPED','COMPLETED'].includes(o.status)?'<li>模拟履约状态<small>未连接真实物流</small></li>':''}${o.completed?`<li>模拟完成<small>${o.completed} · DEMO</small></li>`:''}${logs.filter(l=>l.id===o.id).map(l=>`<li>${l.text}<small>本次原型演练 · 示例店主 · ${l.time}</small></li>`).join('')}</ol></section></div><div class="dialog-foot"><span class="small muted">${role==='owner'?'高影响动作需再次确认':'当前角色仅查看；权限为设计提案'}</span>${btn('关闭','close-drawer')}${canSim?btn(o.status==='CREATED'?'模拟支付（演示）':'模拟完成（演示）','simulate-confirm',`data-id="${o.id}"`,'primary'):o.status==='PAID'?btn('发货待接入','noop','disabled'):''}</div></div>`;if(!$('drawer').open)$('drawer').showModal()}

function confirmSim(id){const o=orders.find(x=>x.id===id);if(role!=='owner'||!o||!['CREATED','SHIPPED'].includes(o.status))return;const pay=o.status==='CREATED';showModal(pay?'确认演练模拟支付':'确认演练模拟完成',`<div class="callout amber"><strong>仅更新本页虚构样例。</strong> 不写入服务端，不产生真实收款、库存扣减或结算。</div><div class="confirm-facts"><p>门店：清和茶事 · 示例店</p><p>订单：${o.id}</p><p>模拟金额：${money(total(o))}</p><p>状态：${labels[o.status]} → ${pay?'待发货 · 模拟':'已完成 · 模拟'}</p><p>操作者：示例店主</p></div><p>${pay?'确认后样例进入待发货，不代表顾客真实付款。':'确认后记入演练日期的模拟完成流水，不代表真实签收。'}</p>${pay?'':`<label class="field" style="margin-top:18px">完成时间（北京时间，演练日期）<input id="demo-completed" type="datetime-local" value="2026-11-13T11:00" min="2026-11-13T00:00" max="2026-11-13T23:59"></label>`}`,btn('仅更新原型样例','simulate-apply',`data-id="${o.id}"`,'primary'))}
function batchShip(){const selected=orders.filter(o=>selection.has(o.id)),eligible=selected.filter(o=>o.status==='PAID');if(role==='service')return;showModal('批量发货 · 范围预览',`<div class="callout amber">批量提交尚未接入。此预览不修改订单，不会向物流发起请求。</div><p><strong>已选 ${selected.length} 笔</strong>，其中 ${eligible.length} 笔状态可发货，${selected.length-eligible.length} 笔需排除。</p><div class="batch-preview-list">${selected.map(o=>`<div class="batch-preview-item"><div><strong>${o.id}</strong><p class="small muted">${o.product} × ${o.qty}</p></div><span class="pill ${o.status==='PAID'?'teal':'amber'}">${o.status==='PAID'?'待核对物流':'排除：状态不符'}</span></div>`).join('')}</div><p class="result-note">正式提交前须逐单核对物流和数量，并重新校验门店、权限与订单版本。跨页选择应绑定同一筛选快照，部分失败须逐条说明。</p>`,btn('批量提交待接入','noop','disabled','primary'))}
function batchStock(){if(role==='service')return;const list=allSkus().filter(s=>skuSelection.has(s.id));showModal('批量库存 · 盘点差异预览',`<div class="callout amber">调整对象为 SKU 实物总量。锁定量保持不变；批量保存尚未接入，不修改库存。</div><div class="batch-preview-list">${list.map(s=>`<label class="batch-preview-item"><div><strong>${s.product} / ${s.id}</strong><p class="small muted">原实物 ${s.available+s.locked} · 锁定 ${s.locked}</p><span class="small" id="delta-${s.id}">预览可用 ${s.available}</span></div><span><span class="small">盘点实物量</span><input type="number" min="${s.locked}" max="999999" step="1" value="${s.available+s.locked}" data-stock-input="${s.id}" aria-label="${s.id} 盘点实物量"></span></label>`).join('')}</div><p class="result-note">预览可用量 = 盘点实物量 − 锁定量。小于锁定量或非整数时显示错误。正式库存语义和批量接口仍需后端确认。</p>`,btn('批量保存待接入','noop','disabled','primary'))}
function exportOrders(){if(role==='service')return;const rows=orders.filter(o=>selection.has(o.id));if(!rows.length)return;const csv=[['声明','门店','订单号','商品','SKU','数量','模拟金额','状态','完成时间'],...rows.map(o=>['虚构样例·非真实交易','清和茶事·示例店',o.id,o.product,o.sku,o.qty,total(o),labels[o.status],o.completed||''])].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='千客_选中模拟订单.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已生成 ${rows.length} 笔选中样例，请查看浏览器下载记录`)}
document.addEventListener('click',event=>{const close=event.target.closest('[data-close]');if(close){$(close.dataset.close).close();return}const nav=event.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return}const od=event.target.closest('[data-order]');if(od){drawer(orders.find(o=>o.id===od.dataset.order));return}const ft=event.target.closest('[data-filter]');if(ft){statusFilter=ft.dataset.filter;selection.clear();page=1;render();toast('筛选已更新，跨页选择已清空');return}const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const a=target.dataset.action;if(['home','orders','products','service','aftersales'].includes(a)){navigate(a);return}if(a==='pending'||a==='unpaid'){navigate('orders');statusFilter=a==='pending'?'PAID':'CREATED';render();return}if(a==='lowstock'){navigate('products');onlyLow=true;render();return}if(a==='detail'){drawer(orders.find(o=>o.id===target.dataset.id));return}if(a==='context-order'){drawer(orders[0]);return}if(a==='conversation'){toast('当前为虚构会话布局；坐席服务尚未接入');return}if(a==='recover'){const wasDenied=pageState==='denied';pageState='normal';$('state').value='normal';query='';statusFilter='';selection.clear();onlyLow=false;if(wasDenied)view='home';render();return}if(a==='clear-filters'){query='';statusFilter='';page=1;selection.clear();render();toast('筛选与选择已清空');return}if(a==='prev'||a==='next'){page+=a==='next'?1:-1;render();return}if(a==='select-filter'){filtered().forEach(o=>selection.add(o.id));render();return}if(a==='clear-selection'){selection.clear();render();return}if(a==='all-products'||a==='low-products'){onlyLow=a==='low-products';skuSelection.clear();render();return}if(a==='clear-skus'){skuSelection.clear();render();return}if(a==='close-drawer'){$('drawer').close();return}if(a==='close-modal'){$('modal').close();return}if(a==='simulate-confirm'){confirmSim(target.dataset.id);return}if(a==='simulate-apply'){const o=orders.find(x=>x.id===target.dataset.id);if(role!=='owner'||!o||!['CREATED','SHIPPED'].includes(o.status))return;let action;if(o.status==='CREATED'){o.status='PAID';action='演练模拟支付'}else{const value=$('demo-completed').value;if(!/^2026-11-13T\d{2}:\d{2}$/.test(value)){toast('请选择演练日期 2026-11-13 的有效时间');return}o.status='COMPLETED';o.completed=value.replace('T',' ');action='演练模拟完成'}logs.push({id:o.id,text:action,time:new Date().toLocaleTimeString('zh-CN')});$('modal').close();drawer(o);render();toast('已更新本页样例；未产生任何真实交易');return}if(a==='batch-ship'){batchShip();return}if(a==='batch-stock'){batchStock();return}if(a==='export-orders')exportOrders()});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.select){el.checked?selection.add(el.dataset.select):selection.delete(el.dataset.select);render()}if(el.id==='selectPage'){filtered().slice((page-1)*4,page*4).forEach(o=>el.checked?selection.add(o.id):selection.delete(o.id));render()}if(el.dataset.sku){el.checked?skuSelection.add(el.dataset.sku):skuSelection.delete(el.dataset.sku);render()}});
document.addEventListener('input',event=>{const el=event.target;if(!el.dataset.stockInput)return;const s=allSkus().find(s=>s.id===el.dataset.stockInput),v=Number(el.value),valid=el.value!==''&&Number.isInteger(v)&&v>=s.locked&&v<=999999;const line=$('delta-'+s.id);line.textContent=valid?`预览可用 ${v-s.locked}（${v-(s.available+s.locked)>=0?'+':''}${v-(s.available+s.locked)}）`:`请输入 ${s.locked}–999999 的整数，不能小于锁定量`;line.style.color=valid?'var(--teal)':'var(--red)';el.setAttribute('aria-invalid',String(!valid))});
document.addEventListener('submit',event=>{if(event.target.id!=='searchForm')return;event.preventDefault();query=$('search').value.trim();selection.clear();page=1;render();toast('已应用筛选，跨页选择已清空')});
$('role').onchange=()=>{role=$('role').value;navigate('home');toast('已切换布局预览；真实权限没有变化')};$('state').onchange=()=>{pageState=$('state').value;selection.clear();skuSelection.clear();render()};$('menu').onclick=()=>{$('sidebar').classList.toggle('open');$('veil').classList.toggle('open');$('menu').setAttribute('aria-expanded',String($('sidebar').classList.contains('open')))};$('veil').onclick=closeNav;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});$('reset').onclick=()=>{orders=structuredClone(orderSeed);logs=[];role='owner';$('role').value='owner';$('drawer').close();$('modal').close();navigate('home');toast('已恢复固定样例，演练记录已清空')};
render();
</script>
</body></html>
