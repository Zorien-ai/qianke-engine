<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ea" />
  <title>登录 · 小鱼</title>
  <link rel="stylesheet" href="/static/c-login.css" />
</head>
<body>
  <div class="c-auth-page">
    <header class="c-auth-brand">
      <span class="c-brand-mark" aria-hidden="true">鱼</span>
      <div>
        <strong>小鱼</strong>
        <p>你的购物伙伴</p>
      </div>
    </header>

    <main class="c-auth-card">
      <div class="c-auth-tabs" role="tablist" aria-label="登录或注册">
        <button type="button" class="is-active" data-tab="login" role="tab" aria-selected="true">登录</button>
        <button type="button" data-tab="register" role="tab" aria-selected="false">注册</button>
      </div>

      <p id="auth-alert" class="c-auth-alert" role="alert" hidden></p>

      <section id="login-panel" class="c-auth-panel" aria-label="登录">
        <h1>欢迎回来</h1>
        <p class="c-auth-sub">和小鱼继续逛，挑东西、比价、看订单。</p>

        <label class="c-field">
          <span>手机号</span>
          <input id="login-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" />
        </label>

        <div id="code-login-fields">
          <label class="c-field">
            <span>验证码</span>
            <div class="c-code-row">
              <input id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" />
              <button id="login-send" type="button" class="c-code-btn">获取验证码</button>
            </div>
          </label>
          <p id="dev-code-hint" class="c-dev-hint" hidden></p>
        </div>

        <div id="password-login-fields" hidden>
          <label class="c-field">
            <span>密码</span>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码" />
          </label>
        </div>

        <label class="c-check">
          <input id="login-remember" type="checkbox" />
          <span>记住登录状态</span>
        </label>

        <button id="login-submit" type="button" class="c-primary">验证码登录</button>
        <button id="toggle-password-mode" type="button" class="c-link-btn">使用密码登录</button>
      </section>

      <section id="register-panel" class="c-auth-panel" aria-label="注册" hidden>
        <h1>认识一下</h1>
        <p class="c-auth-sub">手机号注册，马上就能和小鱼聊天。</p>

        <label class="c-field">
          <span>手机号</span>
          <input id="register-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" />
        </label>

        <label class="c-field">
          <span>验证码</span>
          <div class="c-code-row">
            <input id="register-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" />
            <button id="register-send" type="button" class="c-code-btn">获取验证码</button>
          </div>
        </label>
        <p id="register-dev-hint" class="c-dev-hint" hidden></p>

        <label class="c-field">
          <span>昵称</span>
          <input id="register-nickname" type="text" maxlength="20" placeholder="小鱼怎么称呼你" />
        </label>

        <label class="c-field">
          <span>密码</span>
          <input id="register-password" type="password" autocomplete="new-password" placeholder="至少 8 位，用于密码登录" />
        </label>

        <label class="c-check">
          <input id="register-terms" type="checkbox" />
          <span>我已阅读并同意《用户协议》和《隐私政策》</span>
        </label>

        <button id="register-submit" type="button" class="c-primary">注册并进入小鱼</button>
      </section>

      <p class="c-auth-foot">
        <a href="/login">商家 / 平台登录</a>
      </p>
    </main>
  </div>
  <script src="/static/c-login.js" defer></script>
</body>
</html>
