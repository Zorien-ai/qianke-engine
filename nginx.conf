# ============================================================================
# 千客引擎 · 前端 Nginx 配置
#
# 职责：
#   1. 在 /v2/ 托管 Vue 构建产物；
#   2. 把真实 API 路由代理到 backend:8000；
#   3. 开启 gzip；
#   4. 80 端口负责跳转 HTTPS，443 负责 TLS 终止。
#
# 注意：
#   - 前端使用 hash 路由（#/chat），但 try_files 仍然保留：以后切 history
#     路由时只需改前端 router，不会因为刷新直接 404。
#   - 后端路由不只是 /api/：前端还会调用 /qa、/auth、/whoami、/admin 等，
#     所以不能只写 location /api/，否则对话/登录都会 404。
#   - 443 需要证书：
#       ./certs/fullchain.pem
#       ./certs/privkey.pem
#     compose 会把 ./certs 挂载到 /etc/nginx/certs。
#     没有证书时 Nginx 会启动失败，SOP 中有生成自签证书/申请正式证书的步骤。
# ============================================================================

# ---------- 公共代理头 ----------
# 抽成 include 不方便在单文件里复用，这里在每处 location 里显式写，
# 方便新手逐段阅读、逐段复制。
upstream qianke_backend {
    server backend:8000;
    keepalive 16;
}

# ---------- Gzip ----------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ---------- HTTP：证书申请 + 跳转 HTTPS ----------
server {
    listen 80;
    server_name _;

    # 健康检查不能被 301 掉，否则容器 healthcheck 会一直失败
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt / certbot 的 HTTP-01 校验目录
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 其余 HTTP 一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：静态站点 + API 反向代理 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 上传文档/图片：按业务上限调整
    client_max_body_size 50m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 前端静态资源 ----------
    # Vue 产物在镜像的 /usr/share/nginx/html/v2
    root /usr/share/nginx/html;

    location = /v2 {
        return 301 /v2/;
    }

    location /v2/ {
        # 请求 /v2/chat 这类路径时回退到 SPA 入口；
        # 当前前端用 hash 路由，实际主要命中 /v2/index.html。
        try_files $uri $uri/ /v2/index.html;
    }

    # favicon/logo 等根路径静态文件（如有需要可调整）
    location = /favicon.ico {
        try_files /v2/favicon.ico =404;
        access_log off;
    }

    # ---------- FastAPI 反向代理 ----------
    # 1) /api/ 覆盖 kb、wizard、marketing、monitor、billing、auth 等
    location /api/ {
        proxy_pass http://qianke_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # 2) 问答（普通 + SSE 流式）：流式必须关闭代理缓冲
    location = /qa {
        proxy_pass http://qianke_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location = /qa/stream {
        proxy_pass http://qianke_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE 必须实时下发
        proxy_cache off;
        proxy_read_timeout 600s;      # 深度思考可能超过 60s
    }

    # 3) 登录、注册、演示登录、登出
    location /auth/ {
        proxy_pass http://qianke_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4) 身份与旧登录入口
    location = /whoami {
        proxy_pass http://qianke_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        proxy_pass http://qianke_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 5) 管理端页面与接口（员工、权限、监控、账单等）
    location /admin/ {
        proxy_pass http://qianke_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6) 其他后端根路径
    location ~ ^/(stats|health|metrics|openapi\.json|docs) {
        proxy_pass http://qianke_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7) 根路径进工作台
    location = / {
        return 302 /v2/;
    }

    # 容器健康检查（HTTP 端口也有一份；HTTPS 版本用于 TLS 验证）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
