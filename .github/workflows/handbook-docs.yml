name: Handbook Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/handbook/**"
      - "docs-site/**"
  pull_request:
    branches: [main]
    # No paths filter: this job becomes a required branch check for every PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handbook-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build + content/route/dead-link checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install docs dependencies
        run: npm install --no-audit --no-fund

      - name: Build docs site
        run: npm run build

      - name: Check 60 articles, status, links, and generated routes
        run: node scripts/check-content.mjs --require-dist
